trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: 'Build API Proxy Bundle'
    jobs:
      - job: BuildJob
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: 'Install Node.js'

          - script: |
              echo "Building and validating Apigee API proxy..."
              npm install
            displayName: 'Install Dependencies & Lint'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/apiproxy'
              artifactName: 'apiproxy-bundle'
            displayName: 'Publish Proxy Artifact'

  - stage: Deploy_Dev
    displayName: 'Deploy to Dev'
    dependsOn: Build
    jobs:
      - deployment: DeployDev
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'apiproxy-bundle'
                - script: |
                    echo "Deploying proxy to Apigee DEV environment..."
                  displayName: 'Run Apigee Deployment to Dev'

  - stage: Deploy_QA
    displayName: 'Deploy to QA'
    dependsOn: Deploy_Dev
    jobs:
      - deployment: DeployQA
        environment: 'qa'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'apiproxy-bundle'
                - script: |
                    echo "Deploying proxy to Apigee QA environment..."
                  displayName: 'Run Apigee Deployment to QA'

  - stage: Deploy_UAT
    displayName: 'Deploy to UAT'
    dependsOn: Deploy_QA
    jobs:
      - deployment: DeployUAT
        environment: 'uat'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'apiproxy-bundle'
                - script: |
                    echo "Deploying proxy to Apigee UAT environment..."
                  displayName: 'Run Apigee Deployment to UAT'

  - stage: Deploy_Prod
    displayName: 'Deploy to Production'
    dependsOn: Deploy_UAT
    jobs:
      - deployment: DeployProd
        environment: 'prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'apiproxy-bundle'
                - script: |
                    echo "Executing zero-downtime deployment to Production environment..."
                  displayName: 'Run Apigee Production Deployment'
